<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TagTag - Tab Management Tool</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="app">
    <!-- Left Sidebar: Spaces -->
    <aside class="sidebar-left" id="sidebarLeft">
      <div class="sidebar-header">
        <span class="logo">TagTag</span>
        <button class="sidebar-left-toggle" id="sidebarLeftToggle" title="Toggle sidebar">
          <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
            <path d="M9 3l-4 4 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <div class="spaces-label">
        <span>Spaces</span>
        <button class="btn-icon spaces-add-btn" id="addSpaceBtn" title="New Space">+</button>
      </div>
      <ul class="spaces-list" id="spacesList"></ul>
      <div class="sidebar-left-footer">
        <button class="settings-btn" id="settingsBtn" title="Preferences">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M6.86 1.33h2.28l.35 1.76c.32.13.62.3.9.5l1.7-.57 1.14 1.96-1.35 1.2c.03.18.05.36.05.55s-.02.37-.05.55l1.35 1.2-1.14 1.96-1.7-.57c-.28.2-.58.37-.9.5l-.35 1.76H6.86l-.35-1.76c-.32-.13-.62-.3-.9-.5l-1.7.57-1.14-1.96 1.35-1.2A3.8 3.8 0 014.07 6.7c0-.19.02-.37.05-.55l-1.35-1.2 1.14-1.96 1.7.57c.28-.2.58-.37.9-.5l.35-1.76zM8 5.33a1.4 1.4 0 100 2.8 1.4 1.4 0 000-2.8z" stroke="currentColor" stroke-width="1.2" fill="none" transform="translate(0,1.3)"/>
          </svg>
          <span class="settings-btn-text">Preferences</span>
        </button>
        <!-- Preference popup menu -->
        <div class="pref-menu" id="prefMenu" hidden>
          <button class="pref-menu-item" data-action="settings">Settings</button>
          <button class="pref-menu-item" data-action="about">About Me</button>
        </div>
      </div>
    </aside>

    <!-- Left resize handle -->
    <div class="resize-handle resize-handle-left" id="resizeLeft"></div>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Bar -->
      <header class="top-bar">
        <div class="top-bar-left">
          <h2 class="current-space-name" id="currentSpaceName">Window</h2>
        </div>
        <div class="top-bar-center">
          <div class="search-box">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
              <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5"/>
              <line x1="11" y1="11" x2="14.5" y2="14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input type="text" id="searchInput" placeholder="Search Tabs" />
          </div>
        </div>
        <div class="top-bar-right">
          <button class="btn-secondary" id="addCollectionBtn">+ Add collection</button>
          <button class="btn-secondary" id="selectTabsBtn">Select Tabs</button>
          <div class="select-actions" id="selectActions" hidden>
            <button class="btn-secondary select-action-btn" id="selectCreateGroupBtn">Create Group</button>
            <button class="btn-secondary select-action-btn" id="selectMoveBtn">Move</button>
            <button class="btn-secondary select-action-btn select-action-btn--danger" id="selectDeleteBtn">Delete</button>
          </div>
          <span class="tab-count" id="tabCount">Tabs (0)</span>
        </div>
      </header>

      <!-- Collections Area (middle: namespaces + tab cards) -->
      <div class="collections-area" id="collectionsArea"></div>
    </main>

    <!-- Right resize handle -->
    <div class="resize-handle resize-handle-right" id="resizeRight"></div>

    <!-- Right Sidebar: Current Tabs -->
    <aside class="sidebar-right" id="sidebarRight">
      <div class="sidebar-right-header">
        <div class="header-left">
          <span id="currentTabsCount">Tabs (0)</span>
        </div>
        <button class="btn-save" id="saveTabsBtn" title="Save all tabs to current space">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <path d="M12.5 14h-9A1.5 1.5 0 012 12.5v-9A1.5 1.5 0 013.5 2H11l3 3v7.5a1.5 1.5 0 01-1.5 1.5z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10 14V9H5v5M5 2v3h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Save
        </button>
      </div>
      <ul class="current-tabs-list" id="currentTabsList"></ul>
    </aside>

    <!-- Right sidebar toggle (outside sidebar so it stays visible when hidden) -->
    <button class="sidebar-toggle-circle" id="sidebarToggle" title="Toggle Current Tabs">
      <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
        <path d="M5 3l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <!-- Modals -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Dialog</h3>
        <button class="btn-icon modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <input type="text" id="modalInput" placeholder="" />
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="modalCancel">Cancel</button>
        <button class="btn-primary" id="modalConfirm">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Space Context Menu -->
  <div class="context-menu" id="contextMenu" hidden>
    <button class="context-menu-item" data-action="import-json">Import JSON</button>
    <button class="context-menu-item" data-action="export-json">Export JSON</button>
    <button class="context-menu-item" data-action="change-icon">Change Icon</button>
    <button class="context-menu-item" data-action="rename">Edit Name</button>
    <button class="context-menu-item context-menu-item--danger" data-action="delete">Delete</button>
  </div>

  <!-- Tab Card Context Menu -->
  <div class="context-menu" id="tabContextMenu" hidden>
    <button class="context-menu-item" data-action="tab-rename">Rename</button>
    <button class="context-menu-item" data-action="tab-edit-url">Edit URL</button>
    <button class="context-menu-item context-menu-item--danger" data-action="tab-delete">Delete</button>
  </div>

  <!-- Collection Drop Menu (Space picker / Copy-Move) -->
  <div class="context-menu" id="collDropMenu" hidden></div>

  <!-- Emoji Picker -->
  <div class="emoji-picker-overlay" id="emojiPickerOverlay" hidden>
    <div class="emoji-picker" id="emojiPicker">
      <div class="emoji-picker-header">
        <h3>Choose Icon</h3>
        <button class="btn-icon modal-close" id="emojiPickerClose">&times;</button>
      </div>
      <div class="emoji-picker-grid" id="emojiPickerGrid"></div>
    </div>
  </div>

  <!-- Settings Overlay -->
  <div class="settings-overlay" id="settingsOverlay" hidden>
    <div class="settings-panel">
      <div class="settings-header">
        <h2>Settings</h2>
        <button class="btn-icon modal-close" id="settingsClose">&times;</button>
      </div>
      <div class="settings-body">
        <div class="settings-row">
          <label>Language</label>
          <select class="settings-select" id="settingLanguage">
            <option value="en">English</option>
            <option value="zh">中文</option>
          </select>
        </div>
        <div class="settings-row">
          <label>Theme</label>
          <select class="settings-select" id="settingTheme">
            <option value="system">System</option>
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </div>
        <div class="settings-row">
          <label>Open Tab Mode</label>
          <select class="settings-select" id="settingOpenTabMode">
            <option value="redirect">Redirect</option>
            <option value="new-tab">New Tab</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- About Overlay -->
  <div class="settings-overlay" id="aboutOverlay" hidden>
    <div class="settings-panel about-panel">
      <div class="settings-header">
        <h2>About Me</h2>
        <button class="btn-icon modal-close" id="aboutClose">&times;</button>
      </div>
      <div class="about-body" id="aboutBody"></div>
    </div>
  </div>

  <!-- Hidden file input for JSON import -->
  <input type="file" id="jsonFileInput" accept=".json" style="display:none" />

  <script src="i18n.js"></script>
  <script src="storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
